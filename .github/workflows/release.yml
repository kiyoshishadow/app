name: Release Rimi APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "Rimi ${{ github.ref_name }} — App Android con Capacitor"
          body: |
            ## 🎉 Rimi ya es una app nativa para Android

            ### Características
            - 💰 Finanzas con saldo persistente y categorías pastel
            - 📅 Agenda con calendario y recordatorios de eventos/cumpleaños
            - 🌸 Calendario de ciclo menstrual con predicciones y alertas nativas
            - 📖 Diario íntimo con lienzos interactivos para dibujar y escribir libremente
            - 🔔 Notificaciones locales nativas para mantenerte informada
            - 💾 Almacenamiento persistente con Capacitor Preferences
            - 🌙 Modo oscuro y hermosos temas de colores pastel
            - 🎵 Sonidos suaves adaptados para interacciones agradables

            ### APK Instalador
            Descarga el archivo `app-debug.apk` adjunto abajo para instalar Rimi en tu Android.

            ### Notas
            - Esta es la versión inicial de depuración (debug).
            - Todos tus datos se almacenan localmente de forma privada en el dispositivo.
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
