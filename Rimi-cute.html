.day-cell.today:before{content:"";position:absolute;inset:-3px;border:2px solid var(--accent);border-radius:16px;opacity:.45;animation:rimiToday 2.8s ease-in-out infinite;pointer-events:none}@keyframes rimiToday{50%{opacity:.12;transform:scale(1.045)}}

.rimi-section-finanzas{--section-emoji:"🐷"}.rimi-section-agenda{--section-emoji:"📅"}.rimi-section-ciclo{--section-emoji:"🌸"}.rimi-section-diario{--section-emoji:"📖"}
@media(hover:hover){.card.motion-hover:hover{transform:translateY(-3px) rotate(.15deg);box-shadow:0 15px 35px var(--ring)}.card.motion-hover:hover>:first-child{transform:rotate(-3deg) scale(1.04)}}

  <body class="antialiased">
    <div id="root"></div>
  
<script>
(()=>{
 const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
 let toastTimer=0,lastSave=0,decorating=false;
 function toast(text){
   if(Date.now()-lastSave<350)return; lastSave=Date.now();
   document.querySelectorAll('.rimi-toast').forEach(x=>x.remove());
   const t=document.createElement('div');t.className='rimi-toast';t.textContent=text;document.body.append(t);setTimeout(()=>t.remove(),2450);
 }
 function hearts(x=innerWidth/2,y=innerHeight-115,emoji='💕'){
   if(reduce())return;
   [-22,0,22].forEach((d,i)=>{const h=document.createElement('span');h.className='rimi-heart';h.textContent=i===1?emoji:'♡';h.style.left=(x+d)+'px';h.style.top=y+'px';h.style.setProperty('--drift',(d/2)+'px');h.style.animationDelay=(i*55)+'ms';document.body.append(h);setTimeout(()=>h.remove(),1000)});
 }
 function decorate(){
   if(decorating)return; decorating=true;
   requestAnimationFrame(()=>{
    const main=document.querySelector('main');
    if(main){[...main.querySelectorAll('.card')].forEach((c,i)=>{c.classList.add('motion-hover');if(!c.dataset.motionSeen){c.dataset.motionSeen='1';c.classList.add('motion-card-in');c.style.setProperty('--stagger',Math.min(i,5)*55+'ms');setTimeout(()=>c.classList.remove('motion-card-in'),850)}})}
    document.querySelectorAll('.fixed.inset-0.z-50 .card').forEach(c=>{if(!c.classList.contains('rimi-modal-card'))c.classList.add('rimi-modal-card')});
    decorating=false;
   });
 }
 const observer=new MutationObserver(decorate);
 addEventListener('DOMContentLoaded',()=>{observer.observe(document.body,{childList:true,subtree:true});decorate()});
 document.addEventListener('click',e=>{
   const b=e.target.closest('button');if(!b)return;
   const nav=b.closest('nav[aria-label="navegación"]');
   if(nav){b.classList.remove('rimi-nav-pop');void b.offsetWidth;b.classList.add('rimi-nav-pop');setTimeout(()=>b.classList.remove('rimi-nav-pop'),550)}
   if(!reduce()&&!b.closest('.fixed.inset-0')){const w=document.createElement('i');w.className='rimi-tap-wave';w.style.left=e.clientX+'px';w.style.top=e.clientY+'px';document.body.append(w);setTimeout(()=>w.remove(),650)}
   const txt=(b.textContent||'').trim();
   if(txt==='←'||txt==='→'){setTimeout(()=>{const cal=document.querySelector('.grid-cols-7');if(cal){cal.style.setProperty('--month-dir',txt==='→'?'12px':'-12px');cal.classList.remove('rimi-calendar-swap');void cal.offsetWidth;cal.classList.add('rimi-calendar-swap')}},20)}
 });
 // Observa guardados de la app y ofrece una respuesta cálida, sin cambiar sus datos.
 const original=Storage.prototype.setItem;
 Storage.prototype.setItem=function(key,value){const result=original.call(this,key,value);if(typeof key==='string'&&key.startsWith('rimi.')&&!/theme|mode|sound|welcomed|notified/.test(key)){setTimeout(()=>{let msg='Todo guardadito 💕',icon='💕';if(key.includes('finance')){msg='Anotado en tu bolsillo 🐷';icon='🪙'}else if(key.includes('agenda')){msg='Plan apuntado en tu agenda 🌷';icon='🌷'}else if(key.includes('cycle')){msg='Registro guardado con cariño 🌸';icon='🌸'}else if(key.includes('diary')){msg='Tus palabras están a salvo 📖';icon='💗'}toast(msg);hearts(innerWidth/2,innerHeight-105,icon)},40)}return result};
 // Un error de formulario recibe una vibración visual breve, nunca agresiva.
 document.addEventListener('invalid',e=>{e.target.classList.add('rimi-shake');setTimeout(()=>e.target.classList.remove('rimi-shake'),400)},{capture:true});
})();
</script>
